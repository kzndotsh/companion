[project]
name = "companion"
version = "0.0.1"
description = "A companion that is a process, with a versioned model of a person."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
companion = "companion.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "basedpyright>=1.20",
    "import-linter>=2",
    "lefthook>=1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
markers = [
    "live: hits real endpoints; never in CI",
]

[tool.ruff]
extend-exclude = ["docs"]
force-exclude = true
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "S", "T20", "ANN", "DTZ", "TRY", "PERF", "FURB", "ISC", "EM", "ARG"]
ignore = ["PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S", "ARG", "TRY", "EM"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Extend the module lists as packages are created. import-linter errors on modules that don't exist.
[tool.importlinter]
root_package = "companion"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-is-pure"
name = "core imports nothing from the shell"
type = "forbidden"
source_modules = ["companion.core"]
forbidden_modules = [
    "companion.store",
    "companion.cli",
    "companion.models",
    "companion.loops",
    "companion.io",
    "companion.daemon",
    "companion.evals",
]

[[tool.importlinter.contracts]]
id = "only-store-owns-sqlite"
name = "only store imports sqlite3"
type = "forbidden"
source_modules = [
    "companion.core",
    "companion.cli",
    "companion.models",
    "companion.loops",
    "companion.io",
    "companion.daemon",
    "companion.evals",
]
forbidden_modules = ["sqlite3"]
allow_indirect_imports = true
